function zbbPlan(income) {
  const T = today(), months = [];
  for (let k = 2; k >= 0; k--) {
    const d = new Date(T + "T12:00:00"); d.setDate(1); d.setMonth(d.getMonth() - k);
    months.push(mkey(d.getFullYear(), d.getMonth()));
  }
  const exp3 = S.exp.filter(e => isDep(e) && months.includes(String(e.date).slice(0,7)));
  const categoryNames = {LOGE:"Logement",FACT:"Factures",ALIM:"Alimentation",TRANS:"Transport",SANTE:"Santé",AUTRE:"Autres essentiels",LOIS:"Loisirs"};
  const essentialKeys = ["LOGE","FACT","ALIM","TRANS","SANTE","AUTRE"];
  const essential = essentialKeys.map(key => {
    const v = sum(exp3.filter(e => (e.categorie || "AUTRE") === key), e => +e.montant || 0) / 3;
    return {label:categoryNames[key], amount:Math.round(v), note:"Moyenne mensuelle observée sur 3 mois"};
  }).filter(x => x.amount > 0);
  const next30 = addDays(T,30);
  const planned = S.shop.filter(i => {
    const n = sNext(i); return n && n >= T && n <= next30;
  });
  const groceries = sum(planned, i => +i.prix || 0);
  const leisureAverage = sum(exp3.filter(e => e.categorie === "LOIS"), e => +e.montant || 0) / 3;
  const activeDebts = S.items.filter(i => i.type === "DETTE" && !st(i).solde);
  const minimums = sum(activeDebts, i => { const paid = sum(S.tx.filter(t => t.itemId === i.id && String(t.date).slice(0,7) === T.slice(0,7)), t => +t.montant || 0); return +i.mensualite > 0 ? Math.max(0, +i.mensualite - paid) : late(i) ? Math.min(st(i).reste, Math.max(5000, income * .05)) : 0; });
  const savingsRecorded = sum(S.exp.filter(e => e.type === "EPA"), e => +e.montant || 0);
  const savingsTarget = 1000000;
  const savingsNeed = Math.max(0, savingsTarget - savingsRecorded);
  const savingsRate = savingsNeed > 0 ? Math.min(income * .10, savingsNeed) : 0;
  const debtTarget = activeDebts.slice().sort((a,b) => (PR[b.priorite]||2)-(PR[a.priorite]||2) || dkey(a).localeCompare(dkey(b)))[0];
  let left = Math.max(0, income), rows = [];
  const allocate = (label, need, note, key) => {
    const amount = Math.min(left, Math.max(0, Math.round(need)));
    left -= amount;
    rows.push({label, amount, need:Math.max(0,Math.round(need)), note, key});
  };
  essential.forEach(x => allocate(x.label, x.amount, x.note, "essential"));
  if (groceries > 0) allocate("Courses planifiées", groceries, "Articles prévus dans les 30 prochains jours", "shopping");
  if (minimums > 0) allocate("Remboursements minimums", minimums, "Mensualités et dettes prioritaires en retard", "debt");
  if (savingsRate > 0) allocate("Épargne de sécurité", savingsRate, "10 % du revenu, jusqu’à 1 000 000 FCFA", "saving");
  if (leisureAverage > 0) allocate("Loisirs / dépenses flexibles", Math.min(leisureAverage, income * .05), "Plafond conseillé : 5 % du revenu, selon tes dépenses passées", "flexible");
  if (left > 0 && debtTarget) allocate("Remboursement supplémentaire", left, "À verser sur " + debtTarget.nom + " (priorité " + (PRL[debtTarget.priorite] || "Normale").toLowerCase() + ")", "extra");
  if (left > 0) allocate("Marge de sécurité", left, "Reste affecté : imprévus et dépenses variables", "buffer");
  const allocated = sum(rows, x => x.amount), shortfall = sum(rows, x => x.need) - allocated;
  return {income, rows, allocated, shortfall:Math.max(0,shortfall), left, savingsRecorded, savingsTarget, targetDebt:debtTarget};
}
function zbbShow(income) {
  const plan = zbbPlan(Math.max(0,Math.round(income || 0)));
  const lines = plan.rows.map(x => `<div class="zbb-line"><span>${esc(x.label)}<small>${esc(x.note)}</small></span><b>${dot(x.amount)} ${esc(S.set.devise)}</b></div>`).join("");
  sheet(`<h3 class="st">Plan d’allocation · ZBB</h3>
    <p class="ss">Chaque franc du revenu est affecté à un besoin précis avant toute dépense.</p>
    <div class="zbb-amount"><input id="zbb_income" type="number" inputmode="decimal" min="0" value="${plan.income}" placeholder="Revenu à répartir"><span>${esc(S.set.devise)}</span></div>
    <button class="pp" id="zbb_recalc" style="width:100%">Recalculer la répartition</button>
    <div class="zbb-card">${lines || '<div class="cap2">Saisis un revenu pour construire ton budget.</div>'}
      <div class="zbb-total"><span>Total affecté</span><b>${dot(plan.allocated)} ${esc(S.set.devise)}</b></div>
    </div>
    ${plan.shortfall > 0 ? `<div class="warn">Tes besoins estimés dépassent ce revenu de ${dot(plan.shortfall)} ${esc(S.set.devise)}. Réduis les postes non essentiels ou ajuste les échéances avec tes créanciers.</div>` : `<div class="zbb-note">Budget équilibré : ${dot(plan.allocated)} ${esc(S.set.devise)} affectés sur ${dot(plan.income)}. ${plan.targetDebt ? "Le surplus est orienté vers " + esc(plan.targetDebt.nom) + "." : "Conserve la marge pour éviter de nouvelles dettes."}</div>`}
    <div class="two"><button class="pb" data-a="close">Fermer</button><button class="pp" id="zbb_apply">Valider le plan</button></div>
    <p class="cap2">Le plan est une recommandation calculée à partir de tes données enregistrées. Il ne crée pas automatiquement de transactions.</p>`);
  $("#zbb_recalc").onclick = () => zbbShow(parseFloat($("#zbb_income").value) || 0);
  $("#zbb_apply").onclick = () => {
    const p = zbbPlan(parseFloat($("#zbb_income").value) || 0);
    S.set.lastZbb = JSON.stringify({date:TODAY_SAFE(), income:p.income, rows:p.rows});
    sync("saveSettings", {lastZbb:S.set.lastZbb});
    toast("Plan sauvegardé dans les réglages");
    closeSheet();
  };
}

  const recent = [];
  for(let k=0;k<3;k++){const d=new Date(T+"T12:00:00");d.setDate(1);d.setMonth(d.getMonth()-k);const key=mkey(d.getFullYear(),d.getMonth());recent.push(sum(S.exp.filter(e=>e.type==="REV"&&String(e.date).slice(0,7)===key),e=>+e.montant||0));}
  zbbShow(thisMonth || Math.round(sum(recent,x=>x)/3));
}

  if (!S.loaded) {
    try {
      const c = JSON.parse(localStorage.getItem("dg_cache"));
      if (c) {
        Object.assign(S, c);
        render();
      }
    } catch (e) {
    }
  }
  try {
    Object.assign(S, await api("getBootstrap"));
    S.loaded = 1;
    render();
  } catch (e) {
    if (/Jeton/.test(e.message)) return setup(e.message);
    if (localStorage.getItem("dg_cache")) toast("Hors ligne : donn\xE9es en cache");
    else $("#app").innerHTML = '<div class="empty">' + esc(e.message) + '<br><br><button class="pb" onclick="load()">R\xE9essayer</button></div>';
  }
}
