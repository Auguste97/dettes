function trS(str){if(S.set.lang!=='en'||!str)return str;const c=str.trim();if(!c)return str;const lead=str.slice(0,str.indexOf(c)),trail=str.slice(str.indexOf(c)+c.length);let o=trC(c);return lead+o+trail}
function trC(c){if(EN[c]!==undefined)return EN[c];for(const[r,f]of ENP){const m=c.match(r);if(m)return f(...m)}
  if(c.includes(' · ')){const p=c.split(' · '),q=p.map(trC);return q.join(' · ')}return c}
function i18n(root){if(S.set.lang!=='en'||!root)return;I18N=1;try{
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;const l=[];while(n=w.nextNode())l.push(n);
  l.forEach(t=>{const v=trS(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v});
  (root.querySelectorAll?root.querySelectorAll('[placeholder],[aria-label],[title]'):[]).forEach(e=>['placeholder','aria-label','title'].forEach(a=>{if(e.hasAttribute(a)){const v=trS(e.getAttribute(a));if(v!==e.getAttribute(a))e.setAttribute(a,v)}}))}finally{I18N=0}}
let I18N=0;
{const _c=window.confirm.bind(window);window.confirm=m=>_c(trS(m))}
