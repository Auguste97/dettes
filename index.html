  const a=D.a,id=D.id;
  if(a==='tab'){S.tab=D.t;if(D.t==='home')S.cp=1;render();scrollTo(0,0)}else if(a==='add')debtForm(null,S.sens);else if(a==='close')closeSheet();
  else if(a==='sens'){S.sens=D.t;render()}else if(a==='sd'){S.sd=!S.sd;render()}else if(a==='day'){S.cal.sel=+D.d;render()}else if(a==='shopDay'){S.cal.sel=D.day;render()}else if(a==='shopExpand'){S.cal.expanded=!S.cal.expanded;render()}
  else if(a==='cm'){const d=new Date(S.cal.y,S.cal.m+ +D.d,1),n=new Date(),cur=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();S.cal={y:d.getFullYear(),m:d.getMonth(),sel:cur?n.getDate():1};render()}
  else if(a==='theme'){S.set.theme=D.t;render();sync('saveSettings',{theme:D.t})}
  else if(a==='reset'){if(confirm('Changer la connexion au Google Sheet ?')){localStorage.removeItem('dg_cfg');setup()}}else if(a==='gear'){if(S.tab==='set')S.tab=S.prev||'home';else{S.prev=S.tab;S.tab='set'}render();scrollTo(0,0)}
  else if(a==='hv'){S.hv=D.t;render()}else if(a==='hm'){S.hm=Math.max(0,S.hm+ +D.d);render()}else if(a==='more'){S.rl+=15;render()}
  else if(a==='bf'){S.bf=D.t;render()}else if(a==='addExp')expForm();else if(a==='exp')expForm(id);else if(a==='delExp'){if(confirm('Supprimer cette dépense ?'))del('exp',id)}
  else if(a==='em'){const d=new Date(S.em.y,S.em.m+ +D.d,1);S.em={y:d.getFullYear(),m:d.getMonth()};render()}
  else if(a==='addShop')shopForm();else if(a==='shop')shopForm(id);else if(a==='buy')buy(id,undefined,D.day);else if(a==='unbuy')unbuy(id,false,D.day);else if(a==='delShop'){if(confirm('Supprimer cet article ?'))del('shop',id)}
  else if(a==='hide'){S.hide=!S.hide;render()}else if(a==='hsel')hSel();else if(a==='hpick'){S.hk=D.t;closeSheet();render()}else if(a==='hadd')hadd();else if(a==='cow')cowSay(1);else if(a==='hgo'){if(D.t==='debts')S.tab='debts';else if(D.t==='SHOP')S.tab='shop';else{S.tab='exp';S.bf=D.t}render();scrollTo(0,0)}else if(a==='dv'){S.dv=D.t;render()}
  else if(a==='plus')plusMenu();else if(a==='pm'){({debt:()=>debtForm(null,S.sens),exp:()=>expForm(),shop:()=>shopForm()})[D.t]()}
  else if(a==='selAcc'){S.ca=id;render()}else if(a==='addAcc')accForm();else if(a==='editAcc')accForm(id);else if(a==='delAcc'){if(confirm('Supprimer ce compte ? Ses opérations resteront dans « Non affecté ».'))delAcc(id)}
  else if(a==='assign')assignSheet();else if(a==='assignTo')assignTo(id);
  else if(a==='debt')detail(id);else if(a==='edit')debtForm(id);else if(a==='pay')payForm(id,D.amt);else if(a==='reopen')reopen(id);
  else if(a==='del'){if(confirm('Supprimer définitivement de la liste ?'))del('item',id)}
  else if(a==='tx')txSheet(id);else if(a==='editTx'){const t=S.tx.find(x=>x.id===id);payForm(t.itemId,null,t)}else if(a==='delTx')del('tx',id)});
document.addEventListener('input',e=>{if(['f_mens','f_m','f_pd'].includes(e.target.id))hint();if(e.target.id==='h_amt'){S.ha=e.target.value;e.target.style.width=Math.max(1.2,e.target.value.length+.2)+'ch';e.target.style.fontSize=hfs(e.target.value.length)+'px';e.target.parentNode.classList.toggle('on',+e.target.value>0)}});
document.addEventListener('change',e=>{const k={f_dev:'devise',s_nom:'nom',s_moy:'moyen',s_soon:'soonDays',s_bud:'budget',s_cpt:'compteDef',s_lang:'lang'}[e.target.id];if(k){S.set[k]=e.target.value;render();sync('saveSettings',{[k]:e.target.value})}});
function setup(msg,u0,t0){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="hero"><div class="cap">Connexion à ton Google Sheet</div></div><div class="box"><div class="kv"><span>URL</span><input id="c_u" placeholder="https://script.google.com/…/exec" autocapitalize="off" autocorrect="off" value="${esc(u0||'')}"></div><div class="kv"><span>Jeton</span><input id="c_t" type="password" autocapitalize="off" autocorrect="off" value="${esc(t0||'')}"></div></div>${msg?`<div class="warn">${esc(msg)}</div>`:''}<div class="two one"><button class="pp" id="c_ok">Connecter</button></div>`;
$('#c_ok').onclick=async()=>{const raw=$('#c_u').value,u=raw.replace(/[\s"'“”\u200b-\u200d\ufeff]/g,''),t=$('#c_t').value.replace(/[\u200b-\u200d\ufeff]/g,'').trim();
if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return setup('L’URL doit commencer par https://script.google.com/ et finir par /exec',raw,t);
if(!t)return setup('Saisis le jeton',u,t);
const b=$('#c_ok');b.disabled=true;b.textContent='Connexion… (jusqu’à 30 s)';
localStorage.setItem('dg_cfg',JSON.stringify({url:u,token:t}));
try{Object.assign(S,await api('getBootstrap'));S.loaded=1;render()}catch(e){localStorage.removeItem('dg_cfg');setup('Échec : '+e.message,u,t)}}}
async function load(){if(!CFG())return setup();
if(!S.loaded){try{const c=JSON.parse(localStorage.getItem('dg_cache'));if(c){Object.assign(S,c);render()}}catch(e){}}
try{Object.assign(S,await api('getBootstrap'));S.loaded=1;render()}catch(e){if(/Jeton/.test(e.message))return setup(e.message);if(localStorage.getItem('dg_cache'))toast('Hors ligne : données en cache');else $('#app').innerHTML='<div class="empty">'+esc(e.message)+'<br><br><button class="pb" onclick="load()">Réessayer</button></div>'}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CFG())load()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(S.tab==='home'&&!document.hidden&&!document.activeElement.matches('input')&&!$('#sh.on'))cowSay(1)},8000);
load();
</script></body></html>
